[project]
name = "reanmath"
version = "0.3.0"
description = "Local RAG tutor (FastAPI) for the Khmer Grade 12 math curriculum, with LaTeX-safe ingestion."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    # Embeddings
    "sentence-transformers>=3.0,<6",
    "torch>=2.3",
    "torchvision>=0.18",  # needed by kiri-ocr; listed so it comes from the CPU index too
    # Extraction, Khmer segmentation and OCR
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "khmer-nltk>=1.6",
    "kiri-ocr>=0.2.15",
    # Answer generation (whichever key is configured is used)
    "anthropic>=0.122",
    "google-genai>=1.0",
    "groq>=0.11",
    # SEA-LION's API is OpenAI-compatible; the client is pointed at its base URL.
    "openai>=1.40",
    "langchain>=1.4.2",
    "khmercut>=0.2.0",
    "pix2text>=1.1.7",
    "texify>=0.2.1",
    "chandra-ocr>=0.2.0",
    "docling>=2.130.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Pick exactly one: they are declared as conflicting below, because one package
# cannot resolve from two indexes at once.
#   uv sync --extra cpu     the Docker image, CI and Render (see Dockerfile)
#   uv sync --extra cuda    a machine with an NVIDIA GPU, for KIRI_DEVICE=cuda
# The CUDA wheels are ~2.5 GB and only speed up local corpus ingestion; the
# server never needs them (hashing embeddings, and no OCR at request time).
# Plain `uv sync` with neither extra takes torch from PyPI, whose Linux wheel
# bundles CUDA anyway -- always pass one.
cpu = [
    "torch>=2.3",
    "torchvision>=0.18",
]
cuda = [
    "torch>=2.3",
    "torchvision>=0.18",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.pytest.ini_options]
testpaths = ["src/tests", "testing.py"]
python_files = ["test_*.py", "testing.py"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
