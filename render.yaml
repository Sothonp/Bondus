# Render Blueprint for the AI coach API. The website is hosted on Netlify (or
# Vercel); set VITE_RAG_API_URL there to this service's URL and redeploy, and
# set CORS_ORIGINS below to the site's origin.
services:
  - type: web
    name: bondus-api
    runtime: docker
    # EMBEDDING_BACKEND=sentence-transformers below loads the e5 model and
    # PyTorch, which need roughly 1.5 GB -- the free instance has 512 MB and
    # will be OOM-killed. Change this to `standard` (2 GB) before deploying.
    # (Left as `free` deliberately: raising it costs money, so it is your call.)
    # To go back to the free tier, set EMBEDDING_BACKEND=hashing and re-embed
    # the index for it, as the note on that variable explains.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false # e.g. https://bondusedu.netlify.app
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Multilingual e5 embeddings: Khmer and English land in one semantic
      # space, so an English question ("explain me limit") can retrieve Khmer
      # passages about លីមីត. Lexical hashing cannot -- it matches shared
      # tokens, and the two scripts share none.
      #
      # REQUIRED FIRST: the committed index is built for whichever backend made
      # it, and the server refuses a mismatched one with EmbeddingMismatchError
      # rather than serving nonsense. Re-embed before the first deploy with
      # this setting, and commit the result:
      #   EMBEDDING_BACKEND=sentence-transformers uv run python scripts/reembed_index.py
      #
      # SCORE_THRESHOLD is left unset so the e5 default of 0.75 applies. Do not
      # carry over the hashing cutoff of 0.15: e5 scores sit high (~0.8) even
      # for a loose match, so 0.15 would let every passage through.
      - key: EMBEDDING_BACKEND
        value: sentence-transformers
      - key: EMBEDDING_MODEL
        value: intfloat/multilingual-e5-small
      - key: EMBEDDING_DEVICE
        value: cpu
      # The model is baked into the image (see Dockerfile), so this warms it
      # from disk at boot instead of downloading ~470 MB on the first question.
      - key: PRELOAD_EMBEDDER
        value: "true"
      # Read photos with the hosted vision models only. PyTorch is now in
      # memory anyway for the embeddings, but Kiri would add its own model on
      # top, and OCR is not worth the headroom on a 2 GB instance.
      # Groq is tried first and Gemini backs it up, so one
      # engine being down or rate-limited no longer leaves the photo unread
      # (that needs GROQ_API_KEY above; with no key the engine is skipped).
      - key: IMAGE_OCR_ENGINES
        value: groq,gemini
      - key: PRELOAD_KIRI
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # Deliberately NOT set here, and worth checking they are unset in the
      # dashboard too:
      #   SCORE_THRESHOLD   the e5 cutoff (0.75) drops every hashing passage,
      #                     so answers stop being grounded. See the note above.
      #   OCR_ENGINE        "hybrid" and "kiri" load the Kiri model and torch,
      #                     which will not fit the free instance. Leave it
      #                     unset so it resolves to Gemini.
      # Optional, to answer with SEA-LION (open models for Southeast Asian
      # languages) instead of Groq. Both are required together; add them in the
      # dashboard, not here, so a deploy is not blocked when they are empty:
      #   SEA_LION_API_KEY, SEA_LION_MODEL, and LLM_PROVIDER=sea-lion
