# Render Blueprint for the AI coach API. The website is hosted on Netlify (or
# Vercel); set VITE_RAG_API_URL there to this service's URL and redeploy, and
# set CORS_ORIGINS below to the site's origin.
services:
  - type: web
    name: bondus-api
    runtime: docker
    # Fits the free instance: hashing embeddings load no model (see envVars).
    # For the e5 embedding model instead, use `plan: standard` (2 GB) and drop
    # EMBEDDING_BACKEND / IMAGE_OCR_ENGINES / PRELOAD_KIRI below.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false # e.g. https://bondusedu.netlify.app
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Lexical hashing search: no model download, no PyTorch at runtime, so the
      # server stays inside 512 MB.
      # TODO: the committed index is still the e5 one, and the server refuses a
      # mismatched index — rebuild and commit it before deploying with this:
      # EMBEDDING_BACKEND=hashing uv run python scripts/ingest_corpus.py --reset
      - key: EMBEDDING_BACKEND
        value: hashing
      # Read photos with Gemini; the local Kiri OCR model would load PyTorch.
      - key: IMAGE_OCR_ENGINES
        value: gemini
      - key: PRELOAD_KIRI
        value: "false"
      - key: LOG_LEVEL
        value: INFO
